    <script>
      // Early suppression of Google Maps development and auth error dialogs
      window.gm_authFailure = function() {};
      (function() {
        var origAlert = window.alert;
        window.alert = function(msg) {
          if (typeof msg === 'string' && (msg.indexOf('Google Maps') !== -1 || msg.indexOf('load Google Maps') !== -1)) {
            return;
          }
          return origAlert.apply(this, arguments);
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
